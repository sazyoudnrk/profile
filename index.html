<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00A9E0">
<meta name="color-scheme" content="light">
<style>:root{color-scheme:light}</style>
<title>sazyoden profile</title>
<style>
:root{
  --navy:#1A2F6E;
  --blue:#00A9E0;
  --sky:#7EE8FA;
  --sky-pale:#E0F9FF;
  --paper:#00A9E0;
  --yellow:#FFB800;
  --yellow-deep:#E09E00;
  --shadow:rgba(26,47,110,.22);

  --ui:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --label:"Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background-color:#00A9E0 !important}
html,body{height:100%;background-color:var(--paper)}
body{
  background-color:var(--paper);
  background-image:
    radial-gradient(var(--yellow) 2.2px,transparent 2.2px),
    radial-gradient(var(--yellow) 2.2px,transparent 2.2px);
  background-size:28px 28px,28px 28px;
  background-position:0 0,14px 14px;
  color:var(--navy);
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  opacity:1;transition:opacity .22s ease;
}
body.is-leaving{opacity:0}
img{display:block;user-select:none;-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

#app{max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 32px);}

.site-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.site-name{
  font-family:var(--label);font-size:26px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--yellow);padding:4px 0 14px 4px;
  -webkit-text-stroke:3px #fff;
  paint-order:stroke fill;
  text-shadow:
    -2px -2px 0 #fff, 0 -2px 0 #fff, 2px -2px 0 #fff,
    -2px  0   0 #fff,                 2px  0   0 #fff,
    -2px  2px 0 #fff, 0  2px 0 #fff, 2px  2px 0 #fff;
}
.site-name b{color:var(--yellow)}

/* イベント参加予定ボタン */
.event-btn{
  flex:none;margin-top:2px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 9px 6px;
  border:2px solid var(--navy);border-radius:14px 11px 15px 12px;
  background:#fff;box-shadow:3px 3px 0 var(--navy);
  transition:transform .1s ease,box-shadow .1s ease;
}
.event-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--navy)}
.event-btn svg{
  width:24px;height:24px;
  fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;
}
.event-btn svg .dot{fill:var(--yellow);stroke:none}
.event-btn span{
  font-size:9px;font-weight:700;line-height:1.25;
  color:var(--navy);text-align:center;letter-spacing:.02em;
}

/* イベント一覧モーダル */
#eventModal[hidden]{display:none}
#eventModal{
  position:fixed;inset:0;z-index:80;
  display:grid;place-items:center;padding:20px;
  background:rgba(26,47,110,.5);
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.ev-sheet{
  position:relative;width:100%;max-width:400px;max-height:80vh;overflow-y:auto;
  background:#fff;border:3px solid var(--navy);
  border-radius:22px 18px 24px 20px;
  box-shadow:0 6px 0 var(--navy),0 16px 30px rgba(26,47,110,.35);
  padding:20px 18px 20px;
  animation:pop .22s cubic-bezier(.2,1.4,.5,1);
}
.ev-close{
  position:absolute;top:12px;right:12px;
  width:34px;height:34px;border-radius:50%;
  border:2px solid var(--navy);background:#fff;
  font-family:var(--label);font-size:15px;font-weight:700;line-height:1;
}
.ev-sheet h3{
  font-family:var(--label);font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--blue);margin-bottom:14px;
}
.ev-sheet h3 span{
  display:block;font-family:var(--ui);font-size:11px;letter-spacing:.04em;
  text-transform:none;color:var(--navy);opacity:.65;margin-top:2px;
}
.ev-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.ev-item{
  display:flex;gap:11px;align-items:flex-start;
  border:2px solid var(--navy);border-radius:14px 11px 15px 12px;
  padding:11px 12px;background:var(--sky-pale);
}
.ev-date{
  flex:none;min-width:56px;text-align:center;
  background:var(--yellow);border:2px solid var(--navy);border-radius:9px;
  padding:4px 5px;
}
.ev-date .y{display:block;font-family:var(--label);font-size:9px;font-weight:700;line-height:1;opacity:.8}
.ev-date .m{display:block;font-family:var(--label);font-size:16px;font-weight:800;line-height:1;margin-top:2px}
.ev-date .d{display:block;font-size:9px;font-weight:700;margin-top:1px}

/* 過去のイベントは控えめに */
.ev-item.is-past{background:#fff;opacity:.6}
.ev-item.is-past .ev-date{background:#fff}
.ev-past-head{margin-top:20px}
.ev-body .t{display:block;font-size:14px;font-weight:700;line-height:1.3}
.ev-body .v{display:block;font-size:11px;margin-top:3px;opacity:.75}
.ev-body .s{
  display:inline-block;margin-top:5px;font-size:11px;font-weight:700;
  background:#fff;border:2px solid var(--navy);border-radius:7px;padding:1px 7px;
}
.ev-empty{font-size:13px;line-height:1.6;opacity:.7;padding:6px 2px}

.card{
  position:relative;background:#fff;
  border:2px solid var(--navy);
  border-radius:26px 22px 28px 20px;
  box-shadow:5px 6px 0 var(--shadow);
}

/* ===== トップのステージ ===== */
#stage{
  position:relative;aspect-ratio:3/5;min-height:580px;overflow:hidden;
  background:linear-gradient(180deg,#FFDB80 0%,#FFF0C4 30%,#FFFDF3 66%,#fff 100%);
}
#character{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  touch-action:manipulation;z-index:1;
  transition:width .55s cubic-bezier(.3,.9,.4,1), top .55s cubic-bezier(.3,.9,.4,1), opacity .25s ease;
}
/* シーン中はキャラが手前に寄る（幅と位置は JS が --scene-w / --scene-top で渡す） */
/* 本体はアイコンよりゆっくり、大きめにふわーっと漂う */
#character .sprite{
  animation:charFloat 7.5s ease-in-out infinite;
  will-change:transform;
}
@keyframes charFloat{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  30%    {transform:translate(3px,-11px) rotate(.6deg)}
  60%    {transform:translate(-3px,-5px) rotate(-.5deg)}
}
/* 接近後はもう少し控えめに揺れる */
#stage.is-scene #character .sprite{animation-duration:5.5s}

#stage.is-scene #character{
  width:var(--scene-w) !important;
  top:var(--scene-top);
  pointer-events:none;
}
/* 接近しきったあと（bust）はもう一段だけ大きく寄る */
#stage.is-scene.is-bust #character{
  width:var(--bust-w) !important;
  top:var(--bust-top);
}
#stage.is-scene #character::after{opacity:0}
#character .sprite{width:100%}
#character::after{
  content:"";position:absolute;left:50%;bottom:2%;width:48%;height:10px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(26,47,110,.13),transparent 70%);
}

.sprite{position:relative;width:100%}
.sprite .stack{display:none}
.sprite .stack.active{display:block}
.sprite .stack img{width:100%;height:auto;position:absolute;left:0;top:0;visibility:hidden}
.sprite .stack img:first-child{position:relative}
.sprite .stack img.on{visibility:visible}

.icon{
  position:absolute;transform:translate(-50%,-50%);z-index:2;
  width:96px;
  touch-action:manipulation;
}
.icon-inner{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  animation:floaty var(--dur,4s) ease-in-out var(--delay,0s) infinite;
  will-change:transform;
}
@keyframes floaty{
  0%,100%{transform:translate(0,0)}
  25%    {transform:translate(var(--dx,3px), calc(var(--dy,5px) * -1))}
  50%    {transform:translate(0, calc(var(--dy,5px) * -0.4))}
  75%    {transform:translate(calc(var(--dx,3px) * -1), var(--dy,5px))}
}
.icon .art{
  width:88px;height:88px;
  display:grid;place-items:center;
  transition:transform .1s ease;
}
.icon .art img{width:100%;height:100%;object-fit:contain}
.icon:active .art{transform:scale(.92)}
.icon .art .sprite{width:100%}
.icon .cap{
  font-family:var(--label);font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  text-align:center;line-height:1.1;white-space:nowrap;
  color:var(--navy);
  text-shadow:2px 2px 0 rgba(255,255,255,.7);
}

/* ===== 他のリンク ===== */
#links,#apps{margin-top:22px;padding:18px 16px 20px}
#links h2,#apps h2{font-family:var(--label);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--blue);margin-bottom:12px}
#links h2 span,#apps h2 span{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.04em;
  text-transform:none;color:var(--navy);opacity:.65;margin-top:2px}

/* ウェブアプリ一覧 */
.app-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:stretch}
.app-item{
  display:flex;flex-direction:column;gap:0;
  border:2px solid var(--navy);
  border-radius:15px 12px 16px 13px;
  background:#fff;overflow:hidden;
  box-shadow:3px 3px 0 var(--sky);
  text-align:left;
  transition:transform .1s ease,box-shadow .1s ease;
}
.app-item:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sky)}
.app-item .thumb{
  aspect-ratio:1/1;width:100%;
  background:var(--sky);
  border-bottom:2px solid var(--navy);
  display:grid;place-items:center;overflow:hidden;
}
.app-item .thumb img{width:100%;height:100%;object-fit:cover}
.app-item .thumb .ph{
  font-family:var(--label);font-size:20px;font-weight:800;
  color:var(--navy);opacity:.5;
}
.app-item .body{padding:7px 7px 9px}
.app-item .t{display:block;font-size:12px;font-weight:700;line-height:1.25}
.app-item .wip{
  display:inline-block;margin-top:3px;
  font-size:9px;font-weight:700;letter-spacing:.02em;
  background:var(--yellow);border:1.5px solid var(--navy);border-radius:6px;
  padding:0 5px;
}
.app-item .n{display:block;font-size:9.5px;line-height:1.35;color:var(--navy);opacity:.65;margin-top:3px}
.link-list{list-style:none;display:flex;flex-direction:column;gap:9px}
.link-cat{
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:800;letter-spacing:.06em;
  color:var(--navy);
  margin-top:6px;
}
.link-cat:first-child{margin-top:0}
.link-cat::after{
  content:"";flex:1;height:2px;
  background:var(--sky);border-radius:2px;
}
.link-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:13px 15px;border:2px solid var(--navy);
  border-radius:14px 12px 15px 11px;background:#fff;
  box-shadow:3px 3px 0 var(--sky);text-align:left;
  transition:transform .1s ease,box-shadow .1s ease;
}
/* 説明が長い項目は縦積みにして読みやすくする */
.link-item.is-long{flex-direction:column;align-items:flex-start;gap:5px}
.link-item.is-long .n{
  font-family:var(--ui);font-size:11px;letter-spacing:0;line-height:1.55;
  color:var(--navy);opacity:.7;
}
.link-item:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sky)}
.link-item .l{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.link-item .t{font-size:15px;font-weight:600}

/* 停止中などの状態バッジ */
.badge{
  display:inline-block;flex:none;
  font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1.5;
  color:var(--navy);background:var(--yellow);
  border:1.5px solid var(--navy);border-radius:6px;
  padding:0 6px;
}
.link-item.has-badge{opacity:.72}
.link-item .n{font-family:var(--label);font-size:11px;letter-spacing:.1em;color:var(--blue);opacity:.7}

.credit{margin-top:26px;text-align:center;font-family:var(--label);
  font-size:11px;letter-spacing:.18em;color:#fff;opacity:.9;
  text-shadow:0 1px 2px rgba(26,47,110,.4)}

/* ===== 浮かぶ装飾アイテム ===== */
.decor{
  position:absolute;z-index:0;   /* キャラ(1)・アイコン(2)より奥 */
  transform:translate(-50%,-50%);
  padding:6px;line-height:1;
  touch-action:manipulation;
  transition:opacity .35s ease, transform .35s cubic-bezier(.3,1.4,.5,1);
}
.decor-in{
  display:block;line-height:1;
  font-size:var(--size,22px);
  animation:floaty var(--dur,5s) ease-in-out var(--delay,0s) infinite;
}
.decor img{width:var(--size,22px);height:var(--size,22px);object-fit:contain}
.decor.is-gone{opacity:0;pointer-events:none}

/* 湧いてくるときはふわっと現れる */
.decor.born{opacity:0;transform:translate(-50%,-50%) scale(.3)}

/* 触ると弾けて消える */
.decor.pop{pointer-events:none;animation:decorPop .34s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes decorPop{
  0%  {transform:translate(-50%,-50%) scale(1);   opacity:1}
  45% {transform:translate(-50%,-50%) scale(1.55);opacity:.85}
  100%{transform:translate(-50%,-50%) scale(.15); opacity:0}
}
#stage.is-scene .decor{opacity:0;pointer-events:none}

/* ===== たこたろ ===== */
#tako{
  position:absolute;z-index:3;left:0;top:0;
  touch-action:manipulation;line-height:1;
  padding:10px;                 /* 動く的なのでタップ判定を少し広めに */
  /* 位置は JS が transform で動かす。ゆっくり泳ぐので長めのイージング */
  transition:transform var(--swim,6s) cubic-bezier(.45,.05,.55,.95), opacity .22s ease;
  will-change:transform;
}
#tako .tako-in{
  display:block;font-size:38px;line-height:1;
  animation:takoWobble 2.3s ease-in-out infinite;
  transition:transform .1s ease;
}
/* 泳ぎながら少し伸び縮み・傾く */
@keyframes takoWobble{
  0%,100%{transform:scale(1,1) rotate(-4deg)}
  50%    {transform:scale(1.06,.94) rotate(4deg)}
}
#tako img{width:52px;height:52px;object-fit:contain}
#tako:active .tako-in{transform:scale(.9)}
#stage.is-scene #tako{opacity:0;pointer-events:none}

/* 寄りの表示（接近アニメなしでいきなりこの状態になる） */
#takoBig{
  position:absolute;left:50%;top:52%;z-index:1;
  width:70%;                       /* 画像の場合の寄りサイズ */
  transform:translate(-50%,-50%);
  font-size:190px;line-height:1;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease,transform .28s cubic-bezier(.3,.9,.4,1);
}
#takoBig img{width:100%;height:auto;display:block}
#stage.is-tako #takoBig{opacity:1;animation:takoBob 2.6s ease-in-out infinite}
#stage.is-tako #character{opacity:0}
@keyframes takoBob{
  0%,100%{transform:translate(-50%,-50%)}
  50%    {transform:translate(-50%,calc(-50% - 12px))}
}

/* ===== ギャルゲ構図のシーン（ステージ内でそのまま展開する） ===== */
#stage.is-scene{background:linear-gradient(180deg,#FFF0C4 0%,#FFFAE8 45%,#fff 100%)}

/* シーンに入るとアイコンはフェードアウトして消える */
.icon{transition:opacity .22s ease}
#stage.is-scene .icon{opacity:0;pointer-events:none}

#burst{ /* 近づく勢いを出す同心円 */
  position:absolute;left:50%;top:44%;z-index:0;
  width:220%;aspect-ratio:1/1;
  transform:translate(-50%,-50%) scale(.35);
  opacity:0;
  background:repeating-radial-gradient(circle,rgba(255,184,0,.5) 0 3px,transparent 3px 26px);
  transition:transform .6s cubic-bezier(.2,.8,.3,1),opacity .6s ease;
  pointer-events:none;
}
#stage.is-scene #burst{transform:translate(-50%,-50%) scale(1);opacity:.45}

/* ADVテキストボックス（ステージ下部に出る） */
#advbox{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  padding:18px 12px 14px;
  max-height:72%;overflow:visible;
  transform:translateY(18px);opacity:0;
  transition:transform .26s cubic-bezier(.2,1.3,.5,1),opacity .26s ease;
  pointer-events:none;
}
#advbox.show{transform:none;opacity:1;pointer-events:auto}
.adv-inner{
  position:relative;
  background:rgba(255,255,255,.94);
  border:3px solid var(--navy);
  border-radius:20px 16px 22px 18px;
  box-shadow:0 6px 0 var(--navy),0 14px 26px rgba(26,47,110,.28);
  padding:24px 16px 16px;
}
.nameplate{
  position:absolute;top:-15px;left:14px;z-index:1;
  background:var(--yellow);
  border:3px solid var(--navy);
  border-radius:12px 10px 13px 9px;
  padding:3px 14px;
  font-size:13px;font-weight:700;letter-spacing:.06em;
  box-shadow:0 3px 0 var(--navy);
}
.adv-text{font-size:15px;line-height:1.7;min-height:3.4em;letter-spacing:.01em;
  max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.adv-text .caret{
  display:inline-block;width:.55em;height:.55em;margin-left:.25em;
  background:var(--blue);border-radius:2px;
  animation:blink .7s steps(2,end) infinite;vertical-align:middle;
}
@keyframes blink{50%{opacity:0}}
.choices{
  display:flex;flex-direction:column;gap:7px;
  margin-top:0;max-height:0;opacity:0;overflow:hidden;
  transition:max-height .34s cubic-bezier(.3,.9,.4,1),
             margin-top .34s cubic-bezier(.3,.9,.4,1),
             opacity .24s ease;
}
/* セリフを読み終えたら、テキストをすーっと押し上げながら選択肢が現れる */
.choices.show{
  margin-top:12px;max-height:34vh;opacity:1;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.choices.show .choice{
  opacity:0;
  animation:choiceIn .3s ease forwards;
  animation-delay:calc(var(--i,0) * 80ms + 120ms);
}
@keyframes choiceIn{ to{opacity:1} }
.choice{
  width:100%;padding:9px 10px;
  display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
  border:2px solid var(--navy);border-radius:12px 10px 13px 11px;
  background:var(--blue);color:#fff;font-weight:700;font-size:13px;line-height:1.35;
  box-shadow:0 3px 0 var(--navy);
  transition:transform .1s ease,box-shadow .1s ease;
}
.choice .badge{background:#fff}
.choice.sub{background:#fff;color:var(--navy)}
.choice.pending{opacity:.5}
.choice.sub:active,.choice:active{transform:translateY(4px);box-shadow:0 0 0 var(--navy)}

#back{
  position:absolute;top:12px;right:12px;z-index:6;
  width:42px;height:42px;border-radius:50%;
  border:3px solid var(--navy);background:#fff;
  box-shadow:0 3px 0 var(--navy);
  font-family:var(--label);font-size:17px;font-weight:700;line-height:1;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
#stage.is-scene #back{opacity:1;pointer-events:auto}
#back:active{transform:translateY(3px);box-shadow:none}

:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body style="background-color:#00A9E0">

<div id="app">
  <div class="site-head">
    <div class="site-name" id="siteName"></div>
    <button class="event-btn" id="eventBtn" aria-label="イベント参加予定を見る">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3"/>
        <path d="M3 10h18"/>
        <path d="M8 3v4M16 3v4"/>
        <rect class="dot" x="7" y="13" width="4" height="4" rx="1"/>
      </svg>
      <span>イベント<br>参加予定</span>
    </button>
  </div>
  <main class="card" id="stage" aria-label="キャラクターとリンク">
    <div id="burst"></div>
    <button id="tako" aria-label="たこたろにさわる"><span class="tako-in"></span></button>
    <div id="takoBig" aria-hidden="true"></div>
    <button id="back" aria-label="もどる">×</button>
    <div id="advbox">
      <div class="adv-inner">
        <div class="nameplate" id="advName"></div>
        <div class="adv-text" id="advText"></div>
        <div class="choices" id="advChoices"></div>
      </div>

const $ = (s,r=document)=>r.querySelector(s);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy = false;

function makeSprite(sets){
  const root = document.createElement("div");
  root.className = "sprite";
  const stacks = {};
  for(const key in sets){
    const frames = [].concat(sets[key] || []);
    if(!frames.length) continue;
    const stack = document.createElement("div");
    stack.className = "stack";
    frames.forEach((src,i)=>{
      const img = document.createElement("img");
      img.src = src; img.alt = ""; img.decoding = "async";
      if(i === 0) img.classList.add("on");
      stack.appendChild(img);
    });
    root.appendChild(stack);
    stacks[key] = stack;
  }
  let timer = null;
  const show = (stack,i)=>{
    for(let k=0;k<stack.children.length;k++) stack.children[k].classList.toggle("on", k===i);
  };
  const stop = ()=>{ if(timer){ clearInterval(timer); timer=null; } };
  return {
    el: root,
    has: k => !!stacks[k],
    stop,
    play(key, opt){
      opt = opt || {};
      const stack = stacks[key];
      if(!stack){ opt.done && opt.done(); return; }
      stop();
      for(const k in stacks) stacks[k].classList.toggle("active", k===key);
      const n = stack.children.length;
      const interval = opt.interval || CONFIG.frameInterval;
      show(stack,0);
      if(n < 2){ if(!opt.loop) setTimeout(()=>opt.done && opt.done(), interval); return; }

      /* 再生するコマ順を組み立てる。
         pingpong: 1→2→3→2→1→2→3→2… と往復する（3コマなら [0,1,2,1]）
         cycle   : 1→2→3→1→2→3… と先頭に戻る */
      let seq = [];
      for(let k = 0; k < n; k++) seq.push(k);
      if(opt.loop && CONFIG.loopMode === "pingpong" && n > 2){
        for(let k = n - 2; k >= 1; k--) seq.push(k);
      }

      let s = 0;
      timer = setInterval(()=>{
        s++;
        if(s >= seq.length){
          if(opt.loop) s = 0;
          else { stop(); show(stack, seq[seq.length-1]); opt.done && opt.done(); return; }
        }
        show(stack, seq[s]);
      }, interval);
    }
  };
}

  if(!url) return;

/* シード固定の疑似乱数。seedがnullなら毎回ランダム */
function makeRandom(seed){
  if(seed === null || seed === undefined) return Math.random;
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 各アイコンの位置(%)を算出。偶数番=左列、奇数番=右列 */
function iconPositions(n, L){
  const rnd = makeRandom(L.seed);
  const rows = Math.ceil(n / 2);
  const out = [];
  for(let i = 0; i < n; i++){
    const col = i % 2;
    const row = (i - col) / 2;
    const t = rows > 1 ? row / (rows - 1) : 0.5;
    const x = L.colX[col] + (rnd() * 2 - 1) * L.jitter.x;
    const y = L.yStart + (L.yEnd - L.yStart) * t + (rnd() * 2 - 1) * L.jitter.y;
    out.push({ x, y });
  }
  return out;
}

    thumb.appendChild(ph);
  }

  const body = document.createElement("div");
  body.className = "body";
  const t = document.createElement("span"); t.className = "t";
  const wip = /（開発中）$/.test(a.label);
  t.textContent = a.label.replace(/（開発中）$/, "");
  body.appendChild(t);
  if(wip){
    const w = document.createElement("span"); w.className = "wip"; w.textContent = "開発中";
    body.appendChild(w);
  }
  const n = document.createElement("span"); n.className = "n"; n.textContent = a.note || "";
  body.appendChild(n);

  b.append(thumb, body);
  b.addEventListener("click", ()=>goto(a.url));
  appList.appendChild(b);
});

/* ---- 他のリンク（カテゴリごとに見出しを出す） ---- */
const list = $("#linkList");

function linkButton(l){
  const b = document.createElement("button");
  const long = (l.note || "").length > 30;   // 説明が長いものは縦積み表示
  b.className = "link-item" + (l.badge ? " has-badge" : "") + (long ? " is-long" : "");
  b.innerHTML = '<span class="l"><span class="t"></span></span><span class="n"></span>';
  b.querySelector(".t").textContent = l.label;
  b.querySelector(".n").textContent = l.note || "";
  if(l.badge){
    const bd = document.createElement("span");
    bd.className = "badge";
    bd.textContent = l.badge;
    b.querySelector(".l").appendChild(bd);
  }
  b.addEventListener("click", ()=>goto(l.url));
  return b;
}

SITE.otherLinks.forEach(group=>{
  /* カテゴリ分けせず従来どおり並べた書き方にも対応しておく */
  if(!group.items){
    const li = document.createElement("li");
    li.appendChild(linkButton(group));
    list.appendChild(li);
    return;
  }
  const head = document.createElement("li");
  head.className = "link-cat";
  head.textContent = group.category;
  list.appendChild(head);

  group.items.forEach(l=>{

    li.appendChild(linkButton(l));
    list.appendChild(li);

});

/* ---- シーン（アイコンが消える → その場で接近 → 吹き出し） ---- */
const advbox  = $("#advbox");
const advName = $("#advName");
const advText = $("#advText");
const advCho  = $("#advChoices");
let typeTimer = null, sceneOpen = false;

function openScene(key){
  const sc = SITE.scenes[key];
  if(!sc) return;
  busy = true;
  sceneOpen = true;

  advbox.classList.remove("show");
  advText.textContent = "";
  clearChoices();
  advName.textContent = sc.name || "";

  /* まずアイコンをフェードアウト。消えきってから接近アニメを始める */
  stage.classList.add("is-scene");
  setTimeout(()=>{
    charSprite.play("walk", { done:()=>{
      stage.classList.add("is-bust");   // ここでもう一段大きくなる
      charSprite.play("bust", { loop:true, interval:CONFIG.bustInterval });
      advbox.classList.add("show");
      typeLine(sc.text, ()=>{ renderChoices(sc); busy = false; });
    }});
  }, CONFIG.scene.fadeIcons);
}

function typeLine(text, done){
  clearInterval(typeTimer);
  if(reduced || !CONFIG.typeSpeed){ advText.innerHTML = renderLine(text); done(); return; }

  /* 表示中に吹き出しをタップすると最後まで一気に出す */
  const skip = ()=>{
    clearInterval(typeTimer);
    advText.innerHTML = renderLine(text);
    advbox.removeEventListener("click", skip);
    busy = false;
    done();
  };
  advbox.addEventListener("click", skip);
  const finish = ()=>{ advbox.removeEventListener("click", skip); done(); };

  let i = 0;
  const caret = '<span class="caret"></span>';
  typeTimer = setInterval(()=>{
    i++;
    advText.innerHTML = renderLine(text.slice(0,i)) + (i < text.length ? caret : "");
    if(i >= text.length){ clearInterval(typeTimer); finish(); }
  }, CONFIG.typeSpeed);
}
/* セリフ内の改行を <br> にして表示する */
function renderLine(t){ return escapeHTML(t).replace(/\n/g, "<br>"); }
function escapeHTML(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* シーンに入ったまま、セリフと選択肢だけ差し替える（接近アニメは再生しない） */
function switchScene(key){
  const sc = SITE.scenes[key];
  if(!sc) return;
  clearInterval(typeTimer);
  busy = true;
  advName.textContent = sc.name || "";
  advText.textContent = "";
  clearChoices();
  typeLine(sc.text, ()=>{ renderChoices(sc); busy = false; });
}

function clearChoices(){
  advCho.innerHTML = "";
  advCho.classList.remove("show");
}

function renderChoices(sc){
  clearChoices();
  (sc.choices || []).forEach((c,i)=>{
    const b = document.createElement("button");
    const pending = !c.scene && !c.url && !c.tako;   // リンク先がまだ空のもの
    b.className = "choice" + (c.sub ? " sub" : "") + (pending ? " pending" : "");
    b.textContent = "";
    const lab = document.createElement("span");
    lab.textContent = c.label + (pending ? "（準備中）" : "");
    b.appendChild(lab);
    if(c.badge){
      const bd = document.createElement("span");
      bd.className = "badge";
      bd.textContent = c.badge;
      b.appendChild(bd);
    }
    b.addEventListener("click", ()=>{
      if(busy) return;
      if(c.tako){                            // たこたろのつぶやきを引き直す
        busy = true;
        advText.textContent = "";
        typeLine(takoLine(), ()=>{ busy = false; });
      }
      else if(c.scene){ switchScene(c.scene); }   // 近づき直さずセリフだけ切り替え
      else goto(c.url);
    });
    b.style.setProperty("--i", i);
    advCho.appendChild(b);
  });
  /* 高さのトランジションを効かせるため、追加した次のフレームで開く */
  requestAnimationFrame(()=>advCho.classList.add("show"));
}

/* ---- 浮かぶ装飾アイテム ---- */
(function setupDecor(){
  const D = SITE.decor;
  if(!D || !D.items || !D.items.length) return;
  const rnd  = (a,b)=> a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  let alive = 0;

  function makeDecor(){
    if(alive >= D.max) return;
    alive++;

    const el = document.createElement("button");
    el.className = "decor";
    el.setAttribute("aria-hidden","true");
    el.tabIndex = -1;
    const inner = document.createElement("span");
    inner.className = "decor-in";
    el.appendChild(inner);

    const src  = pick(D.items);
    const size = rnd(D.size[0], D.size[1]);
    el.style.left = (rnd(D.area.x[0], D.area.x[1]) * 100) + "%";
    el.style.top  = (rnd(D.area.y[0], D.area.y[1]) * 100) + "%";
    el.style.setProperty("--size",  size.toFixed(0) + "px");
    el.style.setProperty("--dur",   rnd(3.2, 6.4).toFixed(2) + "s");
    el.style.setProperty("--delay", (-rnd(0, 6)).toFixed(2) + "s");
    el.style.setProperty("--dx",    rnd(-7, 7).toFixed(1) + "px");
    el.style.setProperty("--dy",    rnd(5, 12).toFixed(1) + "px");

    if(/\.(png|gif|jpe?g|webp|svg)$/i.test(src)){
      const im = document.createElement("img"); im.src = src; im.alt = "";
      inner.appendChild(im);
    }else{
      inner.textContent = src;
    }

    /* 生まれるときはふわっと出す */
    el.classList.add("born");
    stage.appendChild(el);
    requestAnimationFrame(()=>el.classList.remove("born"));

    el.addEventListener("click", ev=>{
      ev.stopPropagation();
      if(el.classList.contains("pop")) return;
      el.classList.add("pop");
      setTimeout(()=>{
        el.remove();
        alive--;
        /* 割ったぶんより多く湧いてくる */
        const n = Math.round(rnd(D.respawnCount[0], D.respawnCount[1]));
        for(let i = 0; i < n; i++){
          setTimeout(makeDecor, rnd(D.respawnDelay[0], D.respawnDelay[1]));
        }
      }, 340);
    });
  }

  for(let i = 0; i < D.count; i++) makeDecor();
})();

/* ---- たこたろ ---- */
const takoBtn = $("#tako");
const takoBig = $("#takoBig");

(function setupTako(){
  const T = SITE.tako;
  if(!T){ takoBtn.style.display = "none"; return; }

  const inner = takoBtn.querySelector(".tako-in");
  if(T.art){
    const im = document.createElement("img"); im.src = T.art; im.alt = "";
    inner.appendChild(im);
    const big = document.createElement("img"); big.src = T.art; big.alt = "";
    takoBig.appendChild(big);
  }else{
    inner.textContent = T.emoji || "🐙";
    takoBig.textContent = T.emoji || "🐙";
  }
  takoBtn.addEventListener("click", ()=>{ if(!busy && !sceneOpen) openTako(); });

  /* ステージ内をランダムに泳ぎ回る。
     行き先を決めて transition で移動 → 着いたらまた次の行き先、の繰り返し */
  const S = T.swim || {};
  const area   = S.area || { x:[0.10,0.90], y:[0.08,0.92] };
  const speed  = S.speed || [5, 9];     // 1回の移動にかける秒数
  const pause  = S.pause || [200, 1400];// 着いてから次に動くまでの間(ms)
  let swimTimer = null;

  const rand = (a,b)=> a + Math.random() * (b - a);

  function swimTo(){
    const r = stage.getBoundingClientRect();
    const x = rand(area.x[0], area.x[1]) * r.width;
    const y = rand(area.y[0], area.y[1]) * r.height;
    const sec = rand(speed[0], speed[1]);
    takoBtn.style.setProperty("--swim", sec.toFixed(2) + "s");
    takoBtn.style.transform = "translate(" + x.toFixed(0) + "px," + y.toFixed(0) + "px) translate(-50%,-50%)";
    swimTimer = setTimeout(swimTo, sec * 1000 + rand(pause[0], pause[1]));
  }

  /* 最初の位置は瞬間移動で置いてから泳ぎ始める */
  const r0 = stage.getBoundingClientRect();
  takoBtn.style.transition = "none";
  takoBtn.style.transform = "translate(" + (T.pos.x * r0.width) + "px," + (T.pos.y * r0.height) + "px) translate(-50%,-50%)";
  requestAnimationFrame(()=>{
    takoBtn.style.transition = "";
    swimTo();
  });

  /* 画面の向きが変わったら現在地を作り直す */
  addEventListener("resize", ()=>{
    clearTimeout(swimTimer);
    swimTo();
  });
})();

let takoIndex = -1;
function takoLine(){
  const lines = (SITE.tako && SITE.tako.lines) || ["……"];
  takoIndex = (takoIndex + 1) % lines.length;   // 押すたび順番に変わる
  return lines[takoIndex];
}

/* 接近アニメなしで、いきなり寄りの状態から始まる */
function openTako(){
  busy = true;
  sceneOpen = true;
  advbox.classList.remove("show");
  advText.textContent = "";
  clearChoices();
  advName.textContent = SITE.tako.name || "";

  charSprite.stop();
  stage.classList.add("is-scene","is-tako");

  setTimeout(()=>{
    advbox.classList.add("show");
    typeLine(takoLine(), ()=>{
      renderChoices({ choices:[
        { label:"たこたろのつぶやきを見る", url:SITE.tako.url }
      ] });
      busy = false;
    });
  }, CONFIG.scene.fadeIcons);
}

function closeScene(){
  clearInterval(typeTimer);
  advbox.classList.remove("show");
  stage.classList.remove("is-scene","is-bust","is-tako");   // 元の状態へ戻る
  charSprite.play("idle", { loop:true });
  sceneOpen = false;
  busy = false;
}
$("#back").addEventListener("click", closeScene);
addEventListener("keydown", e=>{ if(e.key === "Escape" && sceneOpen) closeScene(); });

/* ---- イベント参加予定 ---- */
const eventModal = $("#eventModal");
const eventList  = $("#eventList");
const eventPast  = $("#eventPastList");
const WEEK = ["日","月","火","水","木","金","土"];

/* 1件ぶんの<li>を組み立てる */
function eventItem(e, past){
  const li = document.createElement("li");
  li.className = "ev-item" + (past ? " is-past" : "");

  const date = document.createElement("div");
  date.className = "ev-date";
  const y = document.createElement("span"); y.className = "y";
  y.textContent = e._d.getFullYear();
  const m = document.createElement("span"); m.className = "m";
  m.textContent = (e._d.getMonth()+1) + "/" + e._d.getDate();
  const d = document.createElement("span"); d.className = "d";
  d.textContent = "(" + WEEK[e._d.getDay()] + ")";
  date.append(y, m, d);

  const body = document.createElement("div");
  body.className = "ev-body";
  const t = document.createElement("span"); t.className = "t"; t.textContent = e.title;
  body.appendChild(t);
  if(e.venue){ const v = document.createElement("span"); v.className = "v"; v.textContent = e.venue; body.appendChild(v); }
  if(e.note){ const n = document.createElement("span"); n.className = "v"; n.textContent = e.note; body.appendChild(n); }
  if(e.space){ const sp = document.createElement("span"); sp.className = "s"; sp.textContent = e.space; body.appendChild(sp); }

  li.append(date, body);
  return li;
}

function emptyItem(text){
  const p = document.createElement("li");
  p.className = "ev-empty";
  p.textContent = text;
  return p;
}

function renderEvents(){
  eventList.innerHTML = "";
  eventPast.innerHTML = "";
  const today = new Date(); today.setHours(0,0,0,0);

  const all = (SITE.events || [])
    .map(e => ({ ...e, _d: new Date(e.date + "T00:00:00") }))
    .filter(e => !isNaN(e._d));

  const upcoming = all.filter(e => e._d >= today).sort((a,b) => a._d - b._d);
  const past     = all.filter(e => e._d <  today).sort((a,b) => b._d - a._d);

  if(upcoming.length) upcoming.forEach(e => eventList.appendChild(eventItem(e, false)));
  else eventList.appendChild(emptyItem("いまのところ参加予定はないよ。決まったらここに出るね。"));

  if(past.length) past.forEach(e => eventPast.appendChild(eventItem(e, true)));
  else eventPast.appendChild(emptyItem("まだないよ。"));
}

$("#eventBtn").addEventListener("click", ()=>{
  renderEvents();
  eventModal.hidden = false;
});
$("#eventClose").addEventListener("click", ()=>{ eventModal.hidden = true; });
eventModal.addEventListener("click", e=>{ if(e.target === eventModal) eventModal.hidden = true; });
addEventListener("keydown", e=>{ if(e.key === "Escape" && !eventModal.hidden) eventModal.hidden = true; });

$("#siteName").innerHTML = SITE.name;
$("#credit").textContent = SITE.credit;

(function preload(){
  const urls = [];
  const dig = v => {
    if(typeof v === "string" && (v.indexOf("data:") === 0 || /\.(png|gif|jpe?g|webp|svg)$/i.test(v))) urls.push(v);
    else if(Array.isArray(v)) v.forEach(dig);
    else if(v && typeof v === "object") Object.values(v).forEach(dig);
  };
  dig(SITE);
  urls.forEach(u => { const im = new Image(); im.src = u; });
})();
